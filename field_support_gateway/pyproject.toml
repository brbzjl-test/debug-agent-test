[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "field-support-gateway"
version = "0.1.0"
description = "Server-side gateway for field support handoffs"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
field-support-gateway = "field_support_gateway.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

